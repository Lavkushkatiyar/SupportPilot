name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d supportpilot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supportpilot_test
      REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Verify Python and dependency setup
        run: |
          uv run python --version
          uv run python -c "import sqlalchemy, psycopg; print('Database dependencies imported successfully')"
          uv run python -c "import redis; print('Redis dependency imported successfully')"

      - name: Verify database connection
        run: |
          uv run python -c "from sqlalchemy import create_engine; import os; engine = create_engine(os.environ['DATABASE_URL']); connection = engine.connect(); print('PostgreSQL connection successful'); connection.close(); engine.dispose()"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Generate synthetic CI dataset
        run: uv run python -m scripts.db_load.create_ci_dataset

      - name: Load main dataset
        run: uv run python -m scripts.db_load.load_to_db --dataset data/ci/synthetic_conversations.parquet --limit 1000

      - name: Load historical cases
        run: uv run python -m scripts.db_load.historical_case

      - name: Backfill embeddings
        run: uv run python -m scripts.db_load.backfill_embeddings


      - name: Run tests
        run: >-
          uv run pytest -v
          --ignore=tests/unit/services/test_retrieval.py

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run pyright